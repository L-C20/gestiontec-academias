<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — GestionTec</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="pagina-auth">
    <div class="tarjeta">
      <h1>GestionTec</h1>
      <form id="form-login">
        <div class="campo">
          <label for="slug">Academia (slug)</label>
          <input type="text" id="slug" required placeholder="academia-armonia" />
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="boton boton--primario" style="width:100%">Ingresar</button>
      </form>
      <p class="enlace-alterno">¿Todavía no tenés academia? <a href="registro.html">Crear una</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="login.js"></script>
</body>
</html>
