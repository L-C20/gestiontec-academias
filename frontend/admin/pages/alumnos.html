<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumnos — GestionTec</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="contenido">
      <h1>Alumnos</h1>

      <div class="tarjeta">
        <div class="barra-acciones">
          <input type="search" id="buscador" placeholder="Buscar por nombre, apellido o documento..." style="max-width: 320px" />
          <button id="btn-nuevo" class="boton boton--primario">+ Nuevo alumno</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Documento</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-alumnos"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-fondo" class="modal-fondo oculto">
    <div class="modal-caja">
      <h2 id="modal-titulo">Nuevo alumno</h2>
      <form id="form-alumno">
        <input type="hidden" id="alumno-id" />
        <div class="form-grid">
          <div class="campo">
            <label for="alumno-nombre">Nombre</label>
            <input type="text" id="alumno-nombre" required />
          </div>
          <div class="campo">
            <label for="alumno-apellido">Apellido</label>
            <input type="text" id="alumno-apellido" required />
          </div>
          <div class="campo">
            <label for="alumno-documento">Documento</label>
            <input type="text" id="alumno-documento" />
          </div>
          <div class="campo">
            <label for="alumno-fecha-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="alumno-fecha-nacimiento" />
          </div>
          <div class="campo">
            <label for="alumno-telefono">Teléfono</label>
            <input type="text" id="alumno-telefono" />
          </div>
          <div class="campo">
            <label for="alumno-email">Email</label>
            <input type="email" id="alumno-email" />
          </div>
        </div>
        <div class="campo">
          <label for="alumno-direccion">Dirección</label>
          <input type="text" id="alumno-direccion" />
        </div>
        <div class="form-grid">
          <div class="campo">
            <label for="alumno-contacto-nombre">Contacto de emergencia</label>
            <input type="text" id="alumno-contacto-nombre" placeholder="Nombre" />
          </div>
          <div class="campo">
            <label for="alumno-contacto-telefono">Teléfono de emergencia</label>
            <input type="text" id="alumno-contacto-telefono" />
          </div>
        </div>
        <div class="campo">
          <label for="alumno-observaciones">Observaciones</label>
          <textarea id="alumno-observaciones" rows="2"></textarea>
        </div>
        <div class="modal-acciones">
          <button type="button" id="btn-cancelar" class="boton boton--secundario">Cancelar</button>
          <button type="submit" class="boton boton--primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="alumnos.js"></script>
</body>
</html>
