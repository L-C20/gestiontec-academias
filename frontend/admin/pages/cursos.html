<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos — GestionTec</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <main class="contenido">
      <h1>Cursos</h1>

      <div class="tarjeta">
        <div class="barra-acciones">
          <span id="contador-cursos"></span>
          <button id="btn-nuevo" class="boton boton--primario">+ Nuevo curso</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Disciplina</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-cursos"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-fondo" class="modal-fondo oculto">
    <div class="modal-caja">
      <h2 id="modal-titulo">Nuevo curso</h2>
      <form id="form-curso">
        <input type="hidden" id="curso-id" />
        <div class="campo">
          <label for="curso-disciplina">Disciplina</label>
          <select id="curso-disciplina" required></select>
        </div>
        <div class="campo">
          <label for="curso-nombre">Nombre</label>
          <input type="text" id="curso-nombre" required placeholder="Piano Inicial" />
        </div>
        <div class="campo">
          <label for="curso-descripcion">Descripción</label>
          <textarea id="curso-descripcion" rows="3"></textarea>
        </div>
        <div class="modal-acciones">
          <button type="button" id="btn-cancelar" class="boton boton--secundario">Cancelar</button>
          <button type="submit" class="boton boton--primario">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="../js/layout.js"></script>
  <script src="cursos.js"></script>
</body>
</html>
