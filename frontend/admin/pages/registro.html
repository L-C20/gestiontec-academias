<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear academia — GestionTec</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="pagina-auth">
    <div class="tarjeta">
      <h1>Crear tu academia</h1>
      <form id="form-registro">
        <div class="campo">
          <label for="nombreAcademia">Nombre de la academia</label>
          <input type="text" id="nombreAcademia" required placeholder="Academia Musical Armonía" />
        </div>
        <div class="campo">
          <label for="slug">Identificador único (slug)</label>
          <input type="text" id="slug" required placeholder="academia-armonia" pattern="[a-z0-9\-]+"
                 title="Solo minúsculas, números y guiones" />
        </div>
        <div class="campo">
          <label for="email">Email del administrador</label>
          <input type="email" id="email" required placeholder="admin@academia.com" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="8" placeholder="Mínimo 8 caracteres" />
        </div>
        <button type="submit" class="boton boton--primario" style="width:100%">Crear academia</button>
      </form>
      <p class="enlace-alterno">¿Ya tenés una cuenta? <a href="login.html">Iniciar sesión</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/notificaciones.js"></script>
  <script src="registro.js"></script>
</body>
</html>
